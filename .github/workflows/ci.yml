name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -m "not integration"
      - name: Validate shipped rules
        run: recon rules validate --root .

  integration:
    runs-on: ubuntu-24.04
    env:
      # Throwaway password for the disposable CI container only; it protects nothing.
      MSSQL_SA_PASSWORD: Recon_Test_Pw1!
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Same literal as the job-level env above: the `env` context is not available in service env.
          MSSQL_SA_PASSWORD: Recon_Test_Pw1!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ODBC Driver 18 for SQL Server
        run: |
          curl -sSL -o packages-microsoft-prod.deb \
            https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Wait for SQL Server
        run: |
          python - <<'PY'
          import os, sys, time
          import pyodbc

          dsn = ("Driver={ODBC Driver 18 for SQL Server};Server=localhost,1433;UID=sa;"
                 f"PWD={os.environ['MSSQL_SA_PASSWORD']};TrustServerCertificate=yes")
          deadline = time.monotonic() + 180
          while True:
              try:
                  pyodbc.connect(dsn, timeout=5).close()
                  print("SQL Server is up")
                  break
              except pyodbc.Error as exc:
                  if time.monotonic() > deadline:
                      sys.exit(f"SQL Server did not become ready: {exc}")
                  time.sleep(3)
          PY
      - name: Integration tests
        run: |
          export RECON_TEST_DSN="Driver={ODBC Driver 18 for SQL Server};Server=localhost,1433;UID=sa;PWD=$MSSQL_SA_PASSWORD;TrustServerCertificate=yes"
          pytest -m integration
