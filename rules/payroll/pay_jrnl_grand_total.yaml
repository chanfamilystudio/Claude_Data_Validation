id: pay_jrnl_grand_total
domain: payroll
check_type: control_total
description: Workday payroll journal vs GP payroll GL postings, period totals
owner: payroll
severity: high
left: wd_payroll_journal
right: gp_payroll_gl
measures:
  - {name: net_amount,   left: "SUM(debit - credit)", right: "SUM(DEBITAMT - CRDTAMNT)", tolerance: {abs: 0.01}}
  - {name: debit_total,  left: "SUM(debit)",          right: "SUM(DEBITAMT)",            tolerance: {abs: 0.01}}
  - {name: credit_total, left: "SUM(credit)",         right: "SUM(CRDTAMNT)",            tolerance: {abs: 0.01}}
