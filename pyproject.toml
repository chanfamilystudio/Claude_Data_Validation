[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recon"
dynamic = ["version"]
description = "Workday to Great Plains reconciliation engine backed by SQL Server"
requires-python = ">=3.11"
dependencies = [
    "pyodbc>=5",
    "pydantic>=2.6",
    "PyYAML>=6",
    "typer>=0.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
recon = "recon.cli:app"

[tool.hatch.version]
path = "src/recon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.pytest.ini_options]
markers = ["integration: needs SQL Server via RECON_TEST_DSN"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
